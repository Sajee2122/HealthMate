<ion-header>
  <ion-toolbar>
    <ion-title>Health Records</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Search by date -->
  <ion-item>
    <ion-input
      type="date"
      label="Search by Date"
      labelPlacement="stacked"
      [value]="selectedDate"
      (ionChange)="filterRecords($event)">
    </ion-input>

    <ion-button
      slot="end"
      fill="clear"
      (click)="clearFilter()">
      Clear
    </ion-button>
  </ion-item>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="!loading && records.length === 0"
    class="empty-state">

    <ion-icon name="document-text-outline"></ion-icon>

    <p>
  {{ selectedDate
    ? 'No health records found for this date.'
    : 'Start tracking your daily health activities.' }}
   </p>

  </div>

  <!-- Records -->
  <ion-card *ngFor="let record of records">

    <ion-card-header>
      <ion-card-title>
        {{ record.date }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-grid>
        <ion-row>

          <ion-col size="4">
            <ion-icon name="footsteps-outline"></ion-icon>
            <p>Steps</p>
            <strong>{{ record.steps }}</strong>
          </ion-col>

          <ion-col size="4">
            <ion-icon name="flame-outline"></ion-icon>
            <p>Calories</p>
            <strong>{{ record.calories }}</strong>
          </ion-col>

          <ion-col size="4">
            <ion-icon name="water-outline"></ion-icon>
            <p>Water</p>
            <strong>{{ record.water }} ml</strong>
          </ion-col>

        </ion-row>
      </ion-grid>

      <div class="record-actions">

        <ion-button
          size="small"
          fill="outline"
          [disabled]="record.id == null"
          (click)="editRecord(record.id!)">
          Edit
        </ion-button>

        <ion-button
          size="small"
          color="danger"
          fill="outline"
          [disabled]="record.id == null"
          (click)="deleteRecord(record.id!)">
          Delete
        </ion-button>

      </div>

    </ion-card-content>

  </ion-card>

  <!-- Add Record Button -->
  <ion-fab
    slot="fixed"
    vertical="bottom"
    horizontal="end">

    <ion-fab-button (click)="addRecord()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>

  </ion-fab>

</ion-content>
